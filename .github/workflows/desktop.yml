name: Windows desktop verification

on:
  push:
    branches: [codex/windows-desktop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.19.0
          run_install: false
      - name: Install locked JS build dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Select Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt
      - name: Build web application
        run: pnpm build
      - name: Verify exact public source and embed distribution notices
        run: node scripts/build-license-notices.mjs --source-commit=${{ github.sha }}
      - name: Collect Windows native dependency evidence
        working-directory: apps/desktop
        env:
          RUSTUP_TOOLCHAIN: 1.90.0
        run: |
          node ../../scripts/desktop/native-notices.mjs src-tauri/Cargo.toml native-review
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain dependency lock for review; do not distribute unreviewed binaries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-desktop-lock
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/Cargo.lock
            apps/desktop/native-review/native-notices.json
      - name: Test native storage and build Windows installer
        working-directory: apps/desktop
        env:
          RUSTUP_TOOLCHAIN: 1.90.0
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec tauri build -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../../scripts/desktop/build-installer-ui.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $payloads = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*.exe')
          if ($payloads.Count -ne 1) { throw 'Expected one fixed NSIS payload' }
          $env:OID_NSIS_PAYLOAD = $payloads[0].FullName
          # Tauri patches the bundled EXE with its NSIS bundle type. The loose
          # portable EXE is not the installed payload; verify the actual payload.
          $inspection = Join-Path (Get-Location) 'src-tauri/target/nsis-inspection'
          & 'C:/Program Files/7-Zip/7z.exe' x $payloads[0].FullName "-o$inspection" -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installedPayload = @(Get-ChildItem -LiteralPath $inspection -Recurse -File -Filter 'open-industrial-design-desktop.exe')
          if ($installedPayload.Count -ne 1) { throw 'Expected one bundled application payload' }
          $env:OID_APP_SHA256 = (Get-FileHash -LiteralPath $installedPayload[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'native-review/installed-app.sha256' -Value $env:OID_APP_SHA256 -NoNewline
          # generate_context's path chooses a directory, not an alternate JSON
          # basename. Apply the setup config explicitly to build.rs and codegen.
          $env:TAURI_CONFIG = Get-Content -LiteralPath 'src-tauri/installer.conf.json' -Raw
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features installer,tauri/custom-protocol --bin oid-setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --release --manifest-path src-tauri/Cargo.toml --features installer,tauri/custom-protocol --bin oid-setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../../scripts/desktop/package-windows.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $portable = @(Get-ChildItem windows-package -Directory -Filter '*portable-x64')
          if ($portable.Count -ne 1) { throw 'Expected one portable package' }
          Compress-Archive -LiteralPath $portable[0].FullName -DestinationPath "windows-package/$($portable[0].Name).zip"
          node ../../scripts/desktop/package-checksums.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node ../../scripts/desktop/package-checksums.mjs windows-package --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify isolated install, reinstall and uninstall preserves synthetic data
        run: ./scripts/desktop/test-installation.ps1
      - name: Retain unsigned QA candidates (not a Release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-desktop-qa
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/desktop/windows-package/*.exe
            apps/desktop/windows-package/*.zip
            apps/desktop/windows-package/*.txt
            apps/desktop/windows-package/Cargo.lock
